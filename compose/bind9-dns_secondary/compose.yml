services:
  bind9:
    container_name: bind9-secondary
    image: ubuntu/bind9:9.20-25.04_edge
    environment:
      - BIND9_USER=bind
      - TZ=Europe/London
    ports:
      - 53:53/tcp
      - 53:53/udp
    volumes:
      - ./config/named.conf.local:/etc/bind/named.conf.local
      - ./config/named.conf.options:/etc/bind/named.conf.options
    restart: unless-stopped
