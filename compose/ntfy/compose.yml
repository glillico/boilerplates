services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    # Uncomment the below line if you want to user prometheus metrics.
      # - --enable-metrics
    # Comment out ports section if using a reverse proxy.
    ports:
      - 80:80
    env_file:
      - .env
    volumes:
      - data:/var/lib/ntfy
    healthcheck:
      # optional: remember to adapt the host:port to your environment
      test:
        - CMD-SHELL
        - wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo
          '"healthy"\s*:\s*true' || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  data:
    driver: local

# Comment out ports section and uncomment this section if using a reverse proxy.
