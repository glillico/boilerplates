services:
  nginxproxymanager:
    image: docker.io/jc21/nginx-proxy-manager:2.12.6
    container_name: nginxproxymanager
    ports:
      - 80:80
      - 443:443
      - 81:81
    environment:
      TZ: "Europe/London"
      # Uncomment this if IPv6 is not enabled on your host
      DISABLE_IPV6: "true"
    volumes:
      - data:/data
      - ssl:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
    restart: unless-stopped

volumes:
  data: null
  ssl: null

# Assumes "docker network create npm" has been run.
networks:
  default:
    external: true
    name: npm
