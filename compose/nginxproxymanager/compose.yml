services:
  nginxproxymanager:
    image: docker.io/jc21/nginx-proxy-manager:2.12.6
    container_name: nginxproxymanager
    ports:
      - 80:80
      - 443:443
      - 81:81
    environment:
      - DB_MYSQL_HOST=nginxproxymanager-db
      - DB_MYSQL_PORT=3306
      - DB_MYSQL_USER=npm
      - DB_MYSQL_PASSWORD=npm
      - DB_MYSQL_NAME=npm
      - DISABLE_IPV6=true
    volumes:
      - data:/data
      - ssl:/etc/letsencrypt
    restart: unless-stopped

  nginxproxymanager-db:
    image: docker.io/jc21/mariadb-aria:10.11.5
    container_name: nginxproxymanager-db
    environment:
      - MYSQL_ROOT_PASSWORD=npm
      - MYSQL_DATABASE=npm
      - MYSQL_USER=npm
      - MYSQL_PASSWORD=npm
    volumes:
      - db:/var/lib/mysql
    restart: unless-stopped

volumes:
  data: null
  ssl: null
  db: null

# Comment out ports section for "81:81/tcp" and uncomment this section if using a reverse proxy.
# networks:
#   default:
#     external: true
#     name: npm

