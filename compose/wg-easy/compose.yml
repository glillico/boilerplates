services:
  wg-easy:
    environment:
      - LANG=en
      # Change this to your host's public address
      - WG_HOST=<YOUR_SERVER_IP>
      - PASSWORD_HASH=<YOUR_ADMIN_PASSWORD_HASH>
      - PORT=51821
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=<CLIENT_IP_RANGE i.e. 10.8.0.x>
      - WG_DEFAULT_DNS=<DNS_SERVER_1_IP>, <DNS_SERVER_2_IP>
      - UI_TRAFFIC_STATS=true
      - UI_CHART_TYPE=1

    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    volumes:
      - data:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

volumes:
  data:
    driver: local

# Comment out ports section for "51821:51821/tcp" and uncomment this section if using a reverse proxy.
# networks:
#   default:
#     external: true
#     name: npm
